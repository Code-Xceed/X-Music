plugins {
    id 'unimined-common'
}

repositories {
    mavenCentral()
    maven { url = "https://maven.lavalink.dev/releases" }      // youtube-source v2
}

def localJaadJar = rootProject.file('.gradle-build-home-escalated/caches/modules-2/files-2.1/de.sfuhrm/jaad/0.8.7/f135a2dadb7bbd57067edff30d6efaff838d5479/jaad-0.8.7.jar')

dependencies {
    // JSON config serialization
    implementation 'com.google.code.gson:gson:2.11.0'

    // AAC / M4A decoding (pure Java, kept for local file playback)
    if (localJaadJar.exists()) {
        implementation files(localJaadJar)
    } else {
        implementation 'de.sfuhrm:jaad:0.8.7'
    }

    // MP3 decoding (pure Java, kept for local file playback)
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'

    // OGG Vorbis decoding (pure Java, kept for local file playback)
    implementation 'com.googlecode.soundlibs:vorbisspi:1.0.3.3'
    implementation 'com.googlecode.soundlibs:jorbis:0.0.17.4'

    // FLAC decoding (pure Java, JavaSound SPI)
    implementation 'com.tianscar.javasound:javasound-flac:1.4.1'

    // â”€â”€ LavaPlayer Audio Engine â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Core LavaPlayer â€” official Arbjerg fork on Maven Central (no yt-dlp needed)
    implementation 'dev.arbjerg:lavaplayer:2.2.3'
    // YouTube source v2 â€” pure Java YouTube resolver (replaces yt-dlp subprocess)
    implementation 'dev.lavalink.youtube:v2:1.18.1'
    // SLF4J JCL bridge so LavaPlayer's Apache HTTP logs route to Minecraft's log4j
    implementation 'org.slf4j:jcl-over-slf4j:2.0.17'
}
