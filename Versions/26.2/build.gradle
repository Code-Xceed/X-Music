buildscript {
    dependencies {
        constraints {
            classpath('org.ow2.asm:asm:9.8')
            classpath('org.ow2.asm:asm-commons:9.8')
            classpath('org.ow2.asm:asm-tree:9.8')
            classpath('org.ow2.asm:asm-analysis:9.8')
            classpath('org.ow2.asm:asm-util:9.8')
        }
    }
}

plugins {
    id 'root'
    id 'xyz.wagyourtail.unimined' version '1.4.1-SNAPSHOT' apply false
    id 'xyz.wagyourtail.jvmdowngrader' version '1.3.0'
    id 'xyz.wagyourtail.manifold' version '1.0.0-SNAPSHOT'
}
