plugins {
    id 'java'
    id 'maven-publish'
    id 'xyz.wagyourtail.manifold'
}

version = "${mod_version}-${gradle.ext.minecraft_version}"
base {
    archivesName = "${mod_id}-${project == rootProject ? "" : project.name}"
}

manifold {
    version = manifold_version
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor(manifold.module("preprocessor"))
    annotationProcessor(manifold.module("strings"))
}

processResources {
    var expandProps = ['version'                : mod_version,
                       'group'                  : project.group,
                       'minecraft_version'      : gradle.ext.minecraft_version,
                       'compatible_mc_versions' : gradle.ext.compatible_mc_versions,
                       'mod_name'               : mod_name,
                       'mod_authors'            : mod_authors,
                       'mod_id'                 : mod_id,
                       'license'                : license,
                       'description'            : project.description ?: '',
                       'credits'                : credits,
                       'java_version'           : gradle.ext.java_version]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(gradle.ext.java_version.toString()))
    }
}

// No downgrading needed for Java 25

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
tasks.withType(Sign).configureEach {
    enabled = false
}
tasks.named("compileTestJava").configure {
    enabled = false
}
tasks.named("test").configure {
    enabled = false
}
